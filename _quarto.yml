      ![Co-funded by the European Union](assets/eu-cofunded-en.png){.eu-lockup} Erasmus+ Jean Monnet Module EUR_DATA (grant agreement 101127178).
    center: |
      ::: {.eu-disclaimer}
      Views and opinions expressed are those of the author(s) only and do not necessarily reflect those of the European Union or the European Education and Culture Executive Agency (EACEA). Neither the European Union nor EACEA can be held responsible for them.
      :::
    right: "Maintained by the [Connected Politics Lab](https://github.com/Connected-Politics-Lab)."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: data.qmd
        text: Data
      - href: oer.qmd
        text: Teaching
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/Connected-Politics-Lab/EUR_DATA

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
